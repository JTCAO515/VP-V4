name: Quality Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-nightly-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/check-assets.mjs reads the quarantine source commit's tree;
          # the default shallow fetch makes that `fatal: not a tree object`.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm test:contract
      - run: pnpm test:integration
      - run: pnpm test:security
      # The nightly run is the unscoped superset of quality-pr.yml: a PR only runs the
      # suites its changed paths select, so gates skipped there must still run here.
      - run: pnpm test:e2e
      - run: pnpm exec playwright install chromium
      - run: pnpm exec playwright test --config playwright.config.mjs --workers=1
      - run: pnpm evals
      - run: pnpm check:flags
      - run: pnpm check:assets
      - run: pnpm docs:check

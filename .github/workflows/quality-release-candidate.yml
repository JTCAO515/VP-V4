name: Quality Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate-local-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/check-assets.mjs reads the quarantine source commit's tree;
          # the default shallow fetch makes that `fatal: not a tree object`.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: 'echo "| Suite | Outcome | Skipped | Test files |" >> "$GITHUB_STEP_SUMMARY"'
      - run: 'echo "| --- | --- | ---: | ---: |" >> "$GITHUB_STEP_SUMMARY"'
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm test:contract
      - run: pnpm test:integration
      - name: Prepare pinned Node fixture for offline security tests
        shell: bash
        run: |
          # Official Node linux/amd64 manifest; provenance is recorded under
          # artifacts/QAWEB/ci-image-fallback/node-fixture/registry-digest.json.
          image="docker.io/library/node@sha256:efd0ab5780c2d9ab1f0f869571a00d5edb17793bff4cce4a2792e3eb0ffc7562"
          docker pull --platform linux/amd64 "$image"
          docker tag "$image" node:22-bookworm-slim
      - run: pnpm test:security
      - run: pnpm test:e2e
      - run: pnpm test:e2e:frontend
      - run: pnpm evals
      - run: pnpm db:verify
      - run: pnpm check:flags
      - run: pnpm check:assets
      - run: pnpm check:assets:release
      - run: pnpm docs:check

name: DB Integration

# Runs every gated tests/integration file against disposable local databases.
# Lanes, their switches and the explicit not-in-CI allowlist live in
# scripts/ci-suites/db-integration.mjs; a lane fails on any skipped, todo or cancelled test.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned Supabase CLI: `supabase start` chooses the Auth/PostgREST/PostgreSQL image versions.
  SUPABASE_CLI_VERSION: 2.117.0
  # Pinned `pg` client for the native-PostgreSQL Wiki lane (installed outside the lockfile).
  PG_CLIENT_VERSION: 8.13.1

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      has_db: ${{ steps.scope.outputs.has_db }}
      lanes: ${{ steps.scope.outputs.db_lanes_json }}
      execution_matrix: ${{ steps.execution.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate selector and classify actual changed paths
        id: scope
        env:
          VP_CI_EVENT: ${{ github.event_name }}
          VP_CI_BASE: ${{ github.event.pull_request.base.sha }}
          VP_CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-change-scope.mjs
      - name: Project selected logical lanes into bounded CI execution jobs
        id: execution
        env:
          VP_DB_LANES_JSON: ${{ steps.scope.outputs.db_lanes_json }}
        run: |
          matrix=$(node scripts/ci-suites/db-integration.mjs --ci-matrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - run: node --test tests/unit/governance/ci-change-scope.test.mjs tests/unit/governance/db-integration-ci.test.mjs
      - run: node scripts/ci-suites/db-integration.mjs --list
  lane:
    needs: select
    if: needs.select.outputs.has_db == 'true'
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.execution_matrix).include }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify every integration test file is classified
        run: node scripts/ci-suites/db-integration.mjs --list
      - name: Pull pinned test database images
        if: matrix.lane == 'postgres'
        shell: bash
        run: |
          images=$(node scripts/ci-suites/db-integration.mjs --images)
          test -n "$images"
          for image in $images; do
            # Official Supabase mirror; identical linux/amd64 manifests verified in
            # artifacts/QAWEB/ci-image-fallback/registry-digests.json. Unknown pins fail closed.
            case "$image" in
              public.ecr.aws/supabase/postgres:17.6.1.155) mirror="ghcr.io/supabase/postgres@sha256:3e2a7ab48783077d0122dc72ed5174afb543110c38266c845716c51d130658e4" ;;
              public.ecr.aws/supabase/postgres:17.6.1.159) mirror="ghcr.io/supabase/postgres@sha256:617b62a16858dc8436c1ded1970fa13e33539feb4c98b580cf6274b46b2ab1ef" ;;
              public.ecr.aws/supabase/postgres:17.6.1.167) mirror="ghcr.io/supabase/postgres@sha256:16c0944c77885446d4f2ebbb2191b357feeb3b1295bde2fb1978c113129dbeb4" ;;
              public.ecr.aws/supabase/postgrest:v16.2) mirror="ghcr.io/supabase/postgrest@sha256:6e83b0277ea5de980847e9246d2ec2803e99dfce0e69066f6484bd10c4a5b819" ;;
              *) printf 'Unknown test image pin: %s\n' "$image" >&2; exit 1 ;;
            esac
            docker pull --platform linux/amd64 "$mirror"
            docker tag "$mirror" "$image"
          done
      - name: Prepare native PostgreSQL for the Wiki lane
        if: matrix.lane == 'postgres-native'
        shell: bash
        run: |
          bin=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          test -x "$bin/initdb" && test -x "$bin/pg_ctl"
          mkdir -p "$RUNNER_TEMP/pg-client"
          npm install --prefix "$RUNNER_TEMP/pg-client" --no-save --no-package-lock --ignore-scripts "pg@$PG_CLIENT_VERSION"
          echo "VP_WIKI_PG_BIN=$bin" >> "$GITHUB_ENV"
          echo "VP_WIKI_PG_MODULE=$RUNNER_TEMP/pg-client/node_modules/pg/lib/index.js" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
      - name: Prepare PostgreSQL 17 for resolved-subject integration
        if: matrix.lane == 'postgres-native-17'
        shell: bash
        run: |
          set -euo pipefail
          taskPgBin=/usr/lib/postgresql/17/bin
          taskPgCrypto=/usr/share/postgresql/17/extension/pgcrypto.control
          if ! { test -x "$taskPgBin/postgres" && test -x "$taskPgBin/initdb" && test -x "$taskPgBin/pg_ctl" && test -r "$taskPgCrypto" && "$taskPgBin/postgres" --version | grep -Eq '^postgres \(PostgreSQL\) 17\.'; }; then
            # Only this disposable Ubuntu job installs major17. Never create or
            # start a default cluster; restore temporary CI controls on any exit.
            taskPgTemp=$(mktemp -d "$RUNNER_TEMP/agent005-pg17.XXXXXX")
            taskPgPaths=(/usr/sbin/policy-rc.d /etc/postgresql-common/createcluster.conf /etc/apt/sources.list.d/agent005-pg17.sources /usr/share/postgresql-common/pgdg/agent005-pg17.asc)
            taskPgOriginal=()
            for taskPgIndex in "${!taskPgPaths[@]}"; do
              if test -e "${taskPgPaths[$taskPgIndex]}" || test -L "${taskPgPaths[$taskPgIndex]}"; then
                sudo cp -a "${taskPgPaths[$taskPgIndex]}" "$taskPgTemp/original-$taskPgIndex"
                taskPgOriginal[$taskPgIndex]=1
              else
                taskPgOriginal[$taskPgIndex]=0
              fi
            done
            taskPgRestore() {
              taskPgStatus=$?
              trap - EXIT
              set +e
              taskPgRestoreFailed=0
              for taskPgIndex in "${!taskPgPaths[@]}"; do
                sudo rm -f "${taskPgPaths[$taskPgIndex]}" || taskPgRestoreFailed=1
                if test "${taskPgOriginal[$taskPgIndex]}" = 1; then
                  sudo cp -a "$taskPgTemp/original-$taskPgIndex" "${taskPgPaths[$taskPgIndex]}" || taskPgRestoreFailed=1
                fi
              done
              rm -rf -- "$taskPgTemp" || taskPgRestoreFailed=1
              if test "$taskPgRestoreFailed" != 0; then
                printf 'Failed to restore temporary PG17 CI controls\n' >&2
                exit 1
              fi
              exit "$taskPgStatus"
            }
            trap taskPgRestore EXIT
            printf '#!/bin/sh\nexit 101\n' > "$taskPgTemp/policy-rc.d"
            printf "create_main_cluster = false\nstart_conf = 'manual'\n" > "$taskPgTemp/createcluster.conf"
            sudo install -d /etc/postgresql-common
            sudo rm -f "${taskPgPaths[0]}" "${taskPgPaths[1]}"
            sudo install -m 755 "$taskPgTemp/policy-rc.d" "${taskPgPaths[0]}"
            sudo install -m 644 "$taskPgTemp/createcluster.conf" "${taskPgPaths[1]}"
            # Reuse an already configured official PGDG source. Otherwise use
            # its public signing key and a dedicated temporary noble source.
            if ! grep -RFqs 'apt.postgresql.org/pub/repos/apt' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null; then
              taskPgCodename=$(. /etc/os-release; printf '%s' "$VERSION_CODENAME")
              test "$taskPgCodename" = noble
              taskPgArch=$(dpkg --print-architecture)
              case "$taskPgArch" in amd64|arm64) ;; *) exit 1 ;; esac
              curl --fail --silent --show-error --proto '=https' --tlsv1.2 https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$taskPgTemp/pgdg.asc"
              sudo install -d /usr/share/postgresql-common/pgdg /etc/apt/sources.list.d
              sudo rm -f "${taskPgPaths[2]}" "${taskPgPaths[3]}"
              sudo install -m 644 "$taskPgTemp/pgdg.asc" "${taskPgPaths[3]}"
              printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: noble-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: %s\n' "$taskPgArch" "${taskPgPaths[3]}" > "$taskPgTemp/pgdg.sources"
              sudo install -m 644 "$taskPgTemp/pgdg.sources" "${taskPgPaths[2]}"
            fi
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get -o Dpkg::Options::=--force-confold install -y --no-install-recommends postgresql-17
          fi
          test -x "$taskPgBin/initdb" && test -x "$taskPgBin/pg_ctl" && test -r "$taskPgCrypto"
          "$taskPgBin/postgres" --version | grep -Eq '^postgres \(PostgreSQL\) 17\.'
          mkdir -p "$RUNNER_TEMP/pg-client-17"
          npm install --prefix "$RUNNER_TEMP/pg-client-17" --no-save --no-package-lock --ignore-scripts "pg@$PG_CLIENT_VERSION"
          test -r "$RUNNER_TEMP/pg-client-17/node_modules/pg/lib/index.js"
          echo "VP_WIKI_PG_BIN=$taskPgBin" >> "$GITHUB_ENV"
          echo "VP_WIKI_PG_MODULE=$RUNNER_TEMP/pg-client-17/node_modules/pg/lib/index.js" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
      - uses: supabase/setup-cli@v1
        if: startsWith(matrix.lane, 'supabase-')
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Install Chromium for browser subtests
        if: startsWith(matrix.lane, 'supabase-http-')
        run: |
          pnpm exec playwright install --with-deps chromium
          echo "VP_OPS_BROWSER_EXECUTABLE=$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Run lane (skip, todo or cancel fails)
        run: node scripts/ci-suites/db-integration.mjs --lane "${{ matrix.lane }}" --shard "${{ matrix.shard }}"

  # Single stable check name for branch protection.
  db-integration:
    if: always()
    needs: [select, lane]
    runs-on: ubuntu-24.04
    steps:
      - name: All lanes passed
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          HAS_DB: ${{ needs.select.outputs.has_db }}
          LANE_RESULT: ${{ needs.lane.result }}
        run: |
          test "$SELECT_RESULT" = success
          if [ "$HAS_DB" = true ]; then
            test "$LANE_RESULT" = success
          elif [ "$HAS_DB" = false ]; then
            test "$LANE_RESULT" = skipped
          else
            exit 1
          fi

name: Budget PostgreSQL

# PR coverage is deduplicated into DB Integration's selected postgres lane.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budget-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull the pinned local test database image
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if output=$(docker pull public.ecr.aws/supabase/postgres:17.6.1.159 2>&1); then
              printf '%s\n' "$output"
              exit 0
            else
              status=$?
            fi
            printf '%s\n' "$output"
            case "$output" in
              *toomanyrequests*|*"Rate exceeded"*) ;;
              *) exit "$status" ;;
            esac
            if [ "$attempt" -eq 3 ]; then exit "$status"; fi
            sleep "$((attempt * 10))"
          done
      - name: Run isolated PostgreSQL budget and worker-crash checks
        env:
          VP_BUDGET_DB_TEST: '1'
        run: node --experimental-strip-types --test tests/integration/cost/durable-budget.test.mjs
      - name: Run isolated PostgreSQL Turn lease and cancellation checks
        env:
          VP_TURN_DB_TEST: '1'
        run: node --experimental-strip-types --test tests/integration/turn/durable-work.test.mjs tests/integration/turn/text-work.test.mjs
      - name: Reconcile operational metadata with the isolated PostgreSQL ledger
        env:
          VP_OPS_DB_TEST: '1'
        run: node --experimental-strip-types --test tests/integration/observability/ops-ledger.test.mjs

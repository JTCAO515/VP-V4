name: Quality PR

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-pr-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/check-assets.mjs reads the quarantine source commit's tree;
          # the default shallow fetch makes that `fatal: not a tree object`.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Select checks from the actual changed paths
        id: scope
        env:
          VP_CI_EVENT: ${{ github.event_name }}
          VP_CI_BASE: ${{ github.event.pull_request.base.sha }}
          VP_CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-change-scope.mjs
      - run: pnpm install --frozen-lockfile
      - run: 'echo "| Suite | Outcome | Skipped | Test files |" >> "$GITHUB_STEP_SUMMARY"'
      - run: 'echo "| --- | --- | ---: | ---: |" >> "$GITHUB_STEP_SUMMARY"'
      - run: pnpm lint
      - if: steps.scope.outputs.scope == 'documentation'
        run: node --test tests/unit/governance/*.test.mjs
      - if: steps.scope.outputs.scope != 'documentation'
        run: pnpm typecheck
      - if: steps.scope.outputs.scope != 'documentation'
        run: pnpm build
      - if: steps.scope.outputs.scope != 'documentation'
        run: pnpm test
      - if: steps.scope.outputs.scope != 'documentation'
        run: pnpm test:unit
      - run: pnpm test:contract
      - if: steps.scope.outputs.scope != 'documentation'
        run: pnpm test:integration
      - if: steps.scope.outputs.scope != 'documentation'
        run: pnpm test:security
      - if: steps.scope.outputs.scope != 'documentation'
        run: pnpm test:e2e
      - if: steps.scope.outputs.scope != 'documentation'
        run: pnpm exec playwright install chromium
      - if: steps.scope.outputs.scope != 'documentation'
        run: pnpm exec playwright test --config playwright.config.mjs --workers=1
      - if: steps.scope.outputs.scope != 'documentation'
        run: pnpm evals
      - if: steps.scope.outputs.scope != 'documentation'
        run: pnpm check:flags
      - if: steps.scope.outputs.scope != 'documentation'
        run: pnpm check:assets
      - run: pnpm docs:check

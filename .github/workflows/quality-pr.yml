name: Quality PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-pr-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/check-assets.mjs reads the quarantine source commit's tree;
          # the default shallow fetch makes that `fatal: not a tree object`.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Select checks from the actual changed paths
        id: scope
        env:
          VP_CI_EVENT: ${{ github.event_name }}
          VP_CI_BASE: ${{ github.event.pull_request.base.sha }}
          VP_CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-change-scope.mjs
      - run: pnpm install --frozen-lockfile
      - run: 'echo "| Suite | Outcome | Skipped | Test files |" >> "$GITHUB_STEP_SUMMARY"'
      - run: 'echo "| --- | --- | ---: | ---: |" >> "$GITHUB_STEP_SUMMARY"'
      - run: pnpm lint
      - run: node --test tests/unit/governance/ci-change-scope.test.mjs tests/unit/governance/db-integration-ci.test.mjs
      - if: steps.scope.outputs.scope == 'documentation'
        run: node --test tests/unit/governance/*.test.mjs
      - if: steps.scope.outputs.typecheck == 'true'
        run: pnpm typecheck
      - if: steps.scope.outputs.build == 'true'
        run: pnpm build
      - if: steps.scope.outputs.test == 'true'
        run: pnpm test
      - if: steps.scope.outputs.unit == 'true'
        run: pnpm test:unit
      - if: steps.scope.outputs.contract == 'true'
        run: pnpm test:contract
      - if: steps.scope.outputs.integration == 'true'
        run: pnpm test:integration
      - if: steps.scope.outputs.security == 'true'
        run: pnpm test:security
      - if: steps.scope.outputs.e2e == 'true'
        run: pnpm test:e2e
      - if: steps.scope.outputs.browser == 'true'
        run: pnpm exec playwright install chromium
      - if: steps.scope.outputs.browser == 'true'
        run: pnpm exec playwright test --config playwright.config.mjs --workers=1
      - if: steps.scope.outputs.evals == 'true'
        run: pnpm evals
      - if: steps.scope.outputs.flags == 'true'
        run: pnpm check:flags
      - if: steps.scope.outputs.assets == 'true'
        run: pnpm check:assets
      - run: pnpm docs:check
      # artifacts/ is committed evidence that never shrinks, so the size guard has to
      # run on every PR scope, documentation included — evidence Markdown lands there too.
      - name: Guard artifacts/ growth
        env:
          VP_CI_BASE: ${{ github.event.pull_request.base.sha }}
          VP_CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm check:artifacts

name: Quality PR

on:
  pull_request:
  workflow_dispatch:

jobs:
  deterministic-pr-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/check-assets.mjs reads the quarantine source commit's tree;
          # the default shallow fetch makes that `fatal: not a tree object`.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: 'echo "| Suite | Outcome | Skipped | Test files |" >> "$GITHUB_STEP_SUMMARY"'
      - run: 'echo "| --- | --- | ---: | ---: |" >> "$GITHUB_STEP_SUMMARY"'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:unit
      - run: pnpm test:contract
      - run: pnpm test:integration
      - run: pnpm test:security
      - run: pnpm test:e2e
      - run: pnpm test:e2e:frontend
      - run: pnpm evals
      - run: pnpm check:flags
      - run: pnpm check:assets
      - run: pnpm docs:check

name: Native iOS

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'scripts/ios/**'
      - '.github/workflows/native-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    # The runner is the owner's own Mac. The repository is public, so never execute fork PR code
    # on it: only manual dispatch or a PR whose head branch lives in this repository.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, vp-v4-ios]
    # Full simulator suite can use 30 minutes; leave time for evidence and cleanup.
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Affected PR code checks; manual full Simulator batch
        shell: bash --noprofile --norc -eo pipefail "{0}"
        env:
          NATIVE_EVENT: ${{ github.event_name }}
          NATIVE_BASE: ${{ github.event.pull_request.base.sha }}
          NATIVE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$NATIVE_EVENT" = pull_request ]; then
            python3 scripts/ios/ci.py --pr-base "$NATIVE_BASE" --pr-head "$NATIVE_HEAD" --output "$RUNNER_TEMP/vpj-56-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          else
            python3 scripts/ios/ci.py --output "$RUNNER_TEMP/vpj-56-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vpj-56-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
